· Operations", "est": "3 h", "done": "Four boxes → four ranked lists in one response ≤ 2.5 s; the fit lands in the bag with editable sizes"}, {"id": "A2", "part": "For you", "version": "v3 Full fit", "milestone": "Milestone 2.1 · Operations", "est": "1.5 h", "done": "Viewing three jackets makes the rail mostly jackets; a fresh browser shows New in"}, {"id": "A3", "part": "Near-duplicates + low-stock digest", "version": "v3 Full fit", "milestone": "Milestone 2.1 · Operations", "est": "1.5 h", "done": "Uploading the same file twice prompts; the digest lists the right variants"}, {"id": "A4", "part": "Discount codes + v3 close", "version": "v3 Full fit", "milestone": "Milestone 2.1 · Operations", "est": "2 h", "done": "Expired / minimum-unmet codes refused with reasons; v3 tagged; case study live"}, {"id": "U1", "part": "PWA + Web Share Target", "version": "v4 Share to Offcut", "milestone": "Milestone 2.1 · Operations", "est": "2 h", "done": "On Android: share an Instagram screenshot to Offcut → crop step with the photo → results; the share works from Photos, WhatsApp and Chrome"}, {"id": "U2", "part": "Install + v4 close", "version": "v4 Share to Offcut", "milestone": "Milestone 2.1 · Operations", "est": "1 h", "done": "Reviewer installs from the Lens in one tap; v4 tagged; case study live"}], "docs": [{"name": "PRD", "path": "PRD.md", "md": "# PRD — Offcut: D2C fashion store + AI visual search\n\n**Status:** v1 · lifecycle steps 1–7 complete (2026-09-17) — see [docs/](docs/) · next: step 8 Project Setup (= milestone 1.0), **after Frontrow** (build order 1 → 2 → 4 → 5 → 3 → 6)\n**Name:** Offcut · *streetwear, no filler*\n**URL:** https://offcut.virajdomadia.com (landing live at https://offcut-viraj.vercel.app until DNS)\n**Slot:** #4 · Budget ~38 h (v1 16 · v2 11 · v3 8 · v4 3) · Build third\n**Live artifacts:** [Tracker](https://claude.ai/artifact/L6HANndrvG7ZxktQqRfS8y) (plan rows with status, all docs, mockups, project facts) · [Screens](https://claude.ai/artifact/QRyBudWEkRwfHRsW8DGmvH) (every v1 screen, direction H · Court) · [Direction variants](https://claude.ai/artifact/GXn8tPnv8uMhKXMxjtZeoG) (A–H, H chosen) · Landing: https://offcut-viraj.vercel.app\n\n## One-liner\nA complete D2C streetwear store for a fictional Bengaluru brand — variants, stock, cart, Razorpay checkout, orders, returns, an owner console — where every product photo goes through an image pipeline into a vector index, so the store can say \"more like this\" from day one and, in v2, \"**drop in a photo of an outfit, find the closest pieces we sell**\".\n\n## Who it's for\n- **Shopper:** buying clothes on a phone; guest checkout, account optional.\n- **Owner:** the brand's one operator — products, photos, stock, orders, returns.\n- **Platform (Offcut):** code and seed only — Razorpay webhooks, the image pipeline, embeddings, seed data. No third UI.\n\n## Why this project\n- Clients ask for stores more than anything else; this proves one shipped end to end on a phone, with real money flow (test mode) and stock that never goes negative.\n- E-commerce data modelling (product → variants → inventory, reservations, an order state machine) is what recruiters probe.\n- Visual search adds a second AI shape (vision + embeddings + pgvector) distinct from Tripsmith's agent — and the same joint image/text space powers text search, \"for you\" and duplicate detection for free.\n- **The unique feature (v4, ₹0 per use): share any photo from Instagram or your camera roll straight to Offcut.** The store installs as a PWA and registers as a share target, so the Lens meets shoppers where their photos already are — no app store, no paid call added.\n\n## Locked decisions (2026-09-17) — follow these until the project ends\n\n### 1. Identity: one brand, one store, two consoles-worth of roles\nOffcut **is** the brand: a fictional Bengaluru streetwear label (Indiranagar studio, prices in ₹, sizes S–XL). The site is its own D2C store — no marketplace, no tenancy, no `brand_id`. Roles on one `users` table: `shopper` (optional account) and `owner` (the console at `/owner`). Everything the \"platform\" does is code: webhooks, pipeline, embeddings, seed.\n\n### 2. Seed: 36 products, 8 categories, ~100 CC photos\n| Category | Products | Notes |\n|---|---|---|\n| Tees | 5 | boxy, oversized, graphic, pocket, long-sleeve |\n| Hoodies & sweats | 5 | pullover, zip, crewneck, cropped, heavyweight |\n| Jackets | 5 | denim, coach, bomber, work, shell |\n| Denim & trousers | 5 | wide, straight, cargo, carpenter, track |\n| Shorts | 4 | cargo, mesh, denim, sweat |\n| Caps & beanies | 4 | 6-panel, 5-panel, bucket, beanie |\n| Sneakers | 4 | low, mid, canvas, runner |\n| Bags | 4 | tote, sling, backpack, cap-case |\n\nEach product: 2–3 photos (hero, detail, on-body where Commons has one), 1–3 colourways × sizes S–XL (sneakers: UK 6–11; caps/bags: one size) → ~150 variants, stock 0–40 so some sizes read \"sold out\". All photos are **CC from Wikimedia Commons**, pulled by a script per category with a licence filter, credits in `api/app/seed/photos/CREDITS.md`, embedded at seed time through the same pipeline the owner uses. Plus **10 held-out query photos** (outfit shots, not in the catalogue) for the search eval. Two demo logins on the landing: **shopper** (has one delivered order and an address) and **owner**.\n\n### 3. Versions — base → mid → advanced\nEvery project is cut base → mid → advanced (rule set 2026-09-15), plus one unique free feature as v4 (rule set 2026-09-17). v1 alone is a complete, sellable store — and it already runs the pipeline and the vector index, so v2 adds an input, not an engine, and v4 adds a front door.\n\n| Version | Ships | Proves | ~Hours |\n|---|---|---|---|\n| **v1 Store** (base) | Auth (email + password, `oc_session`, roles shopper/owner; two demo logins) · home + collection pages with filters (category, size, colour, price), sort, Postgres full-text search · product page: gallery with ThumbHash blur-up, size × colour variants, stock state, **\"More like this\"** (pgvector) · cookie cart (guest + merge on sign-in) · **Razorpay** Standard Checkout with stock reservation under row locks, HMAC verify + webhook, order state machine `pending_payment → paid → packed → shipped → delivered` (+ `expired`, `cancelled`) · order tracking by number + email; account: orders, address book · **Owner console:** products & variants CRUD, photo upload → **the image pipeline** (sniff → EXIF strip → resize → ThumbHash → dominant colour → Jina embedding → Blob → pgvector), inventory adjustments, orders board with transitions · seed (decision 2) | A complete store; the model recruiters probe (variants, reservations, state machine, idempotent payments); the pipeline and the vector index are live before the wow needs them | 16 |\n| **v2 Lens** (mid) | **Shop the look:** upload / drag / paste a photo → crop → top 12 matches with similarity %, category filter; \"Search from this photo\" on any product image · **text-to-image search** (\"olive cargo pants\") hybrid with full-text (reciprocal-rank fusion) · returns: request within 7 days of delivered → owner approves → Razorpay refund · order emails (Resend: confirmed, shipped) · owner sales dashboard (7 / 30 d) | The wow; one joint embedding space serving image *and* text queries | 11 |\n| **v3 Full fit** (advanced) | **Shop the whole look:** several crops on one photo → one query each → an outfit board with one match per garment, \"Add the fit to bag\" · **For you** rail: centroid of recently viewed product embeddings → nearest items (cookie-based, no account) · owner near-duplicate check at upload (\"0.97 similar to Boxy Tee 03 — reuse it?\") + low-stock alerts · discount codes | Embeddings as a product surface, not a feature | 8 |\n| **v4 Share to Offcut** (unique, free) | Offcut installs as a **PWA** (manifest, service worker, install prompt on the Lens) and registers a **Web Share Target**: share an image from Instagram, WhatsApp or Photos → Offcut opens on the crop step with that photo → results. \"How to share from Instagram\" card; works offline until the search itself | Reach: the Lens leaves the site and lives in the phone's share sheet — the one thing nobody expects from a store, at ₹0 per use (Viraj, 2026-09-17) | 3 |\n\n### 4. The engine: one pipeline, one vector column, one query\n- **Ingest (v1)** — inline in the owner's upload request, no queue: `POST /owner/products/{id}/photos` (multipart, ≤ 8 MB, jpeg/png/webp) → **Pillow** sniff, EXIF orientation applied and metadata stripped, resize ≤ 2000 px → **ThumbHash** (the blur-up placeholder, ~25 bytes) + **dominant colour** (quantised on a 64 px thumb; feeds the colour filter) → **Vercel Blob** `products/{product_id}/{uuid}.jpg` → **Jina `jina-clip-v2`** image embedding, Matryoshka-truncated to **512 dims** and L2-normalised → `product_photos.embedding vector(512)` with `model` + `dims`. ~1–2 s per photo, all inside the request.\n- **Index and query** — pgvector **HNSW** `vector_cosine_ops` on `product_photos.embedding`. One query for every feature: nearest photos `LIMIT 60` → group by product keeping the best distance → drop the source product → top 12; `score = 1 − distance`. \"More like this\" (v1) feeds the product's hero embedding; Shop the look (v2) feeds the shopper's crop; text search (v2) feeds a Jina **text** embedding of the query — same space, same SQL; \"For you\" (v3) feeds the centroid of recently viewed products.\n- **Search (v2)** — shopper photo ≤ 5 MB → Pillow sniff, crop box applied server-side, resize ≤ 1024 px → embed → query. The query image lives in memory for the request and is **never stored**. Target ≤ 1.5 s p50 from `bom1` (embedding call ≈ 400–800 ms). **Budget guard:** Jina's free tier (10M tokens, no card) covers thousands of queries; the Lens is rate-limited to 10 searches/min/IP and a monthly counter in Postgres switches it to \"back tomorrow\" before the tier is exhausted, so the search never bills.\n- **Embedder boundary** — `services/embedder.py` defines `Embedder.embed_images(list[bytes]) → list[list[float]]` and `embed_texts`; `JinaEmbedder` is the only implementation; the documented fallback is Voyage `voyage-multimodal-3` (same protocol, re-embed ~100 photos via the seed command, no schema change).\n- **Why hosted, why not self-hosted or in-browser:** `api/` runs on Vercel functions (250 MB bundle, no GPU) — torch does not fit, an ONNX int8 CLIP would add seconds of cold start to the demo, and a 90 MB in-browser model is not something a shopper's phone should download. One HTTPS call in the request is the lean answer; the protocol keeps the choice reversible.\n\n### 5. Stock and money: reserve, pay, confirm — idempotently\n- **Checkout** creates an order in `pending_payment` and **reserves** every line in one transaction: variant rows locked in id order, `update variants set reserved = reserved + qty where id = $1 and stock − reserved ≥ qty`; a zero-row update aborts with `409 out_of_stock` naming the line. Then a Razorpay order (paise) is created and its id stored.\n- **Confirm** — the client's `POST /checkout/{id}/verify` (HMAC-SHA256 of `order_id|payment_id`) and the webhook `payment.captured` (signature-checked, event id deduped) both call the same `mark_paid(order)`; whichever lands first flips `pending_payment → paid` and converts the reservation into a decrement (`stock −= qty, reserved −= qty`); the second is a no-op.\n- **Expiry** — a `pending_payment` order older than **15 min** is expired lazily: every checkout and every read of a pending order first runs `expire_stale()`, which releases reservations. No cron.\n- **State machine** — transitions live in one dict in `services/orders.py`; the owner console only offers legal next states; anything else → `409 invalid_transition`. v2 adds `delivered → return_requested → returned | return_rejected`, with the refund through Razorpay's refund API.\n- **Tests only where a demo bug embarrasses:** two concurrent checkouts of the last unit → exactly one succeeds; every transition edge; webhook signature and replay; pipeline yields a 512-d unit vector and a ThumbHash; \"More like this\" never returns its own product; guest cart merges on sign-in. The search eval (10 held-out photos, 8/10 in top 3) is a script, not CI.\n\n### 6. Stack and setup — lean\nShared stack from [`projects/README.md`](../README.md): `web/` Next.js App Router + Tailwind 4, `api/` FastAPI on Vercel (FastAPI preset, `bom1`), **Neon Postgres with `pgvector`**, Vercel Blob, own cookie-session auth (`oc_session`), Razorpay (test mode), Resend (v2). New deps: `Pillow`, `pgvector` (SQLAlchemy type), `httpx`, `thumbhash` in api; `react-easy-crop` in web (v2). Setup is the minimum to deploy both apps with plain CI (web typecheck + build, api ruff + pytest). OpenAPI → TS types by script, committed, not CI-gated; no Sentry, no uptime monitor. **Accounts and keys are created just-in-time** in the plan row that first needs them: Neon in S2, Blob + Jina in F1, Razorpay in F3, Resend in L3.\n\n## The wow moment (v2)\nScreenshot an outfit from Instagram. Drop it on the store. A scanline sweeps the photo, and the closest pieces Offcut sells tile in, ranked, each with a match percentage — the cargo pants at 91 %, a similar jacket at 84 %. Tap one, pick a size, pay. Under a minute on a phone.\n\n## Add-ons (after v4, only from time saved)\nNice-to-have, not priority (Viraj, 2026-09-17): listed in [docs/07-plan.md](docs/07-plan.md) — back-in-stock + wishlist · fit feedback · customer photos · bundles · COD · courier API · \"what they wanted\" · gift cards. Skipping all of them is fine.\n\n## Out of scope (all versions)\nMarketplace / multi-brand · wishlists · reviews · multi-currency · shipping-rate APIs (flat ₹99, free over ₹1,999) · marketing emails · COD · size guides beyond a static table · mobile owner console (owner = desktop) · real-money billing · storing shopper query photos.\n\n## Success criteria\n- A full purchase on a phone in under 2 minutes from the home page (guest, demo card).\n- Stock can never go negative under concurrent checkout — covered by a test in CI; reservations released within 15 min of an abandoned checkout.\n- v1: \"More like this\" returns same-category items in the top 3 for every seeded product (eval script).\n- v2: 8 of the 10 held-out outfit photos put a correct-category product with a sensible look in the top 3; search responds ≤ 1.5 s p50.\n- Lighthouse mobile ≥ 90 perf / 100 a11y / 100 SEO on home, collection and product pages (ThumbHash placeholders, `next/image`, no CLS in the gallery).\n- v4: on an Android phone, share an Instagram screenshot to the installed Offcut → results in one tap; iOS falls back to the paste / picker path.\n- A visible frontend signature: the **Scan** on the Lens (scanline → match count stamps in → tiles pop with their % counting up; chosen in step 4, direction H · Court), Fly to bag + Ticker in v1, themed browser surfaces, reduced-motion fallbacks.\n\n## Resolved questions\n- *Marketplace or one brand?* One brand; platform = code + seed (Viraj, 2026-09-17).\n- *Visual search in v1?* No — v1 runs the whole pipeline and uses it for \"More like this\"; v2 adds the shopper's photo as an input. Same precedent as Frontrow / Pagecraft: the engine in v1, the wow in v2.\n- *Embeddings: hosted vs self-hosted?* Hosted Jina CLIP v2, called inline; `Embedder` protocol keeps it swappable (decision 4).\n- *How many SKUs?* 36 products / ~150 variants / ~100 photos + 10 held-out queries (decision 2).\n- *Accounts required?* No — guest checkout; account offered on the success screen; owner is a role on the same table.\n- *Images: Cloudinary?* No — Vercel Blob + Pillow + `next/image`, one less account; the pipeline is the point.\n- *Fictional brand name?* Offcut itself; studio in Indiranagar, Bengaluru.\n"}, {"name": "03-requirements", "path": "docs/03-requirements.md", "md": "# Offcut — Requirements & Scope\n\n**Lifecycle step:** 3 of 17 · **Locked:** 2026-09-17 · **Source:** [PRD.md](../PRD.md) locked decisions. Flows and screen index: [03-user-flows.md](03-user-flows.md).\n\nActors: **Shopper** (guest or signed in), **Owner** (the brand operator, `/owner`), **Platform** (code: webhooks, pipeline, seed). Each requirement ends with **Accept:** — the check that closes it. Ids: R = v1, R2 = v2, R3 = v3. Money in ₹, integer paise in the DB.\n\n---\n\n## v1 — Store (base, ≈ 16 h)\n\n### R1. Auth & roles\n- Email + password, cookie session (`oc_session`, HttpOnly, SameSite=Lax), sign up / sign in / sign out; roles `shopper` | `owner` on `users`. Two demo logins on the landing: shopper (one delivered order, one address) and owner. Forgot-password arrives with Resend in v2.\n- `/owner/*` requires `owner`; a shopper hitting it gets 404. `/account/*` requires any session.\n- **Accept:** protected routes redirect to sign-in and back; a shopper never sees the console; sessions expire after 30 days.\n\n### R2. Catalogue & browsing\n- Home: hero drop, category strip, \"New in\" rail, \"Shop the look\" teaser (v1: links to a \"coming in v2\" band; v2: live).\n- `/shop` and `/shop/[category]`: product grid (4 / 2 columns), filters in the URL — category, size (in stock only), colour (from dominant colour buckets), price range — sort by new / price ↑↓; full-text search (`tsvector` on name + description + tags) at `/search?q=`.\n- Product card: hero photo with ThumbHash blur-up, name, price, colourway dots, \"sold out\" when every variant is 0.\n- **Accept:** every filter combination is a shareable URL; a filter change never reloads the page; a grid of 36 products scores Lighthouse mobile ≥ 90 perf with no CLS.\n\n### R3. Product page\n- `/p/[slug]`: gallery (2–3 photos, blur-up, pinch/scroll on phone), name, price, description, colourway switch (changes photos), size row with per-size stock state (in stock / low ≤ 3 / sold out), quantity, **Add to bag**, delivery note (flat ₹99, free over ₹1,999).\n- **More like this:** 8 products from `GET /products/{slug}/similar` (pgvector on the hero photo's embedding, own product excluded), as a rail.\n- **Accept:** picking a sold-out size disables the button with a reason; \"More like this\" returns same-category items in its top 3 for every seeded product (eval script); the gallery reserves its aspect ratio (no CLS).\n\n### R4. Cart\n- A `carts` row keyed by a `oc_cart` cookie from the first add (guest) or by `user_id` (signed in); signing in merges the guest cart into the user's cart (sum quantities, cap at stock). Line = variant + qty; price snapshotted at checkout, not in the cart.\n- Bag drawer from any page: lines with photo, size / colour, qty stepper, remove, subtotal, delivery, **Checkout**. Stock is re-checked when the drawer opens; a line over stock is clamped with a notice.\n- **Accept:** add on one page → drawer count updates without reload; guest adds two items, signs in with a cart holding one → three lines; cart survives a browser restart for 30 days.\n\n### R5. Checkout & payment\n- `/checkout`: contact (email, phone), address (name, line 1/2, city, state, PIN — Indian format), summary; signed-in users pick from the address book. **Pay** → `POST /checkout` (reserves stock, creates the Razorpay order) → Razorpay Standard Checkout modal → `POST /checkout/{id}/verify` → `/orders/[number]?key=…` success page.\n- Reservation: per-line `stock − reserved ≥ qty` under row locks in one transaction; failure → `409 out_of_stock` and the checkout page marks the line. Unpaid orders expire after 15 min (lazy `expire_stale()`), releasing stock.\n- Webhook `POST /webhooks/razorpay` (`payment.captured`, `payment.failed`): HMAC-verified, event id deduped; `payment.captured` calls the same `mark_paid` as verify.\n- Success page offers **Create an account** (password only; email already known) which attaches the order and the address.\n- **Accept (tests):** two concurrent checkouts of the last unit → one `paid`, one `409`; verify then webhook (and webhook then verify) both leave exactly one decrement; a replayed webhook is a no-op; an order left unpaid for 16 min is `expired` and its stock is back.\n\n### R6. Orders — shopper side\n- `/orders/[number]`: status timeline `paid → packed → shipped → delivered`, lines, address, totals, payment id; reachable signed in, or as a guest with the `key` from the success page / email (v2) or by **Track order** (`/track`: number + email).\n- `/account`: orders list, address book (add / edit / default), profile.\n- **Accept:** a guest can open their order with number + email and cannot open anyone else's; the timeline reflects owner transitions on reload.\n\n### R7. Owner console — products & the image pipeline\n- `/owner/products`: table (photo, name, category, variants, stock total, status draft / live); `/owner/products/new` and `/owner/products/[id]`: name, slug, category, price (₹), description, tags, colourways, sizes → variants generated as a size × colour matrix with stock per cell; status toggle.\n- **Photos:** drag-drop / picker (≤ 8 MB picked, downscaled in the browser to ≤ 2000 px before upload because Vercel caps request bodies at 4.5 MB; jpeg / png / webp, several at once, sent one per request) → `POST /owner/products/{id}/photos` → pipeline (Pillow sniff, EXIF orientation + strip, resize ≤ 2000 px, ThumbHash, dominant colour, Blob, Jina 512-d embedding) → thumbnail appears with its colour swatch and a \"embedded ✓\" tick; reorder (first = hero, per colourway), delete (removes the Blob).\n- **Accept (tests):** a pipeline run yields a 512-d unit vector, a ThumbHash and a hex colour; a 9 MB or `.gif` upload is refused with a message; a product with no live variants never appears in the shop.\n\n### R8. Owner console — inventory & orders\n- `/owner/inventory`: variant table with stock, reserved, available (`stock − reserved`); adjust with a reason (received / correction / damaged) → `inventory_moves` row; low-stock filter (≤ 3).\n- `/owner/orders`: board columns paid / packed / shipped / delivered (+ tabs for pending, expired, cancelled); an order card opens a drawer with lines, address, payment; **only legal next transitions are offered** (`paid → packed → shipped → delivered`; `paid → cancelled` with a Razorpay refund); shipped takes an optional courier + tracking id.\n- **Accept (test):** every edge of the transition table is allowed exactly as listed; an illegal transition → `409 invalid_transition`; adjusting stock below `reserved` is refused.\n\n### R9. Seed & content\n- Seed script (idempotent): owner + demo shopper, 36 products / ~150 variants / ~100 photos (decision 2) pulled by `seed/fetch_photos.py` from Wikimedia Commons with a licence filter and `CREDITS.md`; each photo runs through the real pipeline (so seed = the first pipeline test); one delivered demo order; 10 held-out query photos in `seed/queries/` for the eval script.\n- **Accept:** `seed` runs twice without duplicates; every product has ≥ 1 embedded photo; `eval_similar.py` reports ≥ 36/36 same-category top-3.\n\n---\n\n## v2 — Lens (mid, ≈ 11 h)\n\n### R2-1. Shop the look\n- `/lens`: drop zone (drag, picker, **paste** from clipboard, camera on phone) → crop step (`react-easy-crop`, free aspect, \"use whole photo\") → `POST /lens/search` (multipart + crop box) → results: the query crop pinned top-left, 12 matches ranked with match % and category chips to filter, each opens the product page. \"Search from this photo\" on every product-page image opens `/lens` with that photo preloaded.\n- Client downscales the picked photo (≤ 5 MB) to ≤ 1024 px before upload. Server: sniff, crop applied, embed, one pgvector query (hero-only excluded from nothing — all photos searched), group by product, top 12; the query image is never stored; ≤ 1.5 s p50.\n- **Accept:** eval script — 8 / 10 held-out outfit photos put a correct-category product in the top 3; a 6 MB file is refused before upload finishes; results render with blur-up, no CLS.\n\n### R2-2. Text-to-image search\n- `/search?q=` becomes hybrid: full-text ranks ∪ Jina text-embedding ranks, fused by reciprocal-rank fusion (k = 60); a \"semantic\" hint shows when the top result came from the vector side.\n- **Accept:** \"olive cargo pants\" returns cargo trousers first even though no product name contains \"olive\".\n\n### R2-3. Returns & refunds\n- Shopper: on a `delivered` order ≤ 7 days old, **Request return** per line with a reason → `return_requested`. Owner: approve (→ Razorpay refund for the line amount → `returned`, stock back) or reject (→ `return_rejected`, note).\n- **Accept (test):** refund amount equals the line total; a second approval is a no-op; a return on a 9-day-old order is refused.\n\n### R2-4. Emails\n- Resend + React Email: order confirmed (with the tracking `key` link), shipped (courier + id), return decision; forgot / reset password.\n- **Accept:** the confirmation arrives within a minute of `paid` with a working link.\n\n### R2-5. Owner dashboard\n- `/owner`: revenue, orders, average order value, top 5 products, low-stock count for 7 / 30 days; small sparklines.\n- **Accept:** numbers match a SQL check over the seeded orders.\n\n---\n\n## v3 — Full fit (advanced, ≈ 8 h)\n\n### R3-1. Shop the whole look\n- `/lens` gains multi-crop: draw up to 4 boxes on one photo (top, bottom, shoes, accessory) → one query per box in a single request → an **outfit board**: best match per box with alternates, \"Add the fit to bag\" adds the four default sizes (editable in the drawer).\n- **Accept:** four boxes → four ranked lists in one response ≤ 2.5 s.\n\n### R3-2. For you\n- Recently viewed product ids in a cookie (last 20) → centroid of their hero embeddings → nearest 8 on the home page (\"For you\"), excluding viewed ones. No account needed.\n- **Accept:** viewing three jackets makes the rail mostly jackets; a fresh browser shows \"New in\" instead.\n\n### R3-3. Owner: near-duplicates & low-stock alerts\n- On photo upload, if the nearest existing photo scores ≥ 0.95, the console shows \"looks like *Boxy Tee 03* — reuse that photo?\" with both thumbnails. Low-stock alert email (daily digest, Resend) when any live variant ≤ 3.\n- **Accept:** uploading the same file twice triggers the prompt; the digest lists the right variants.\n\n### R3-4. Discount codes\n- `discounts(code, type percent | flat, value, min_order, expires_at, uses)`; applied at checkout; owner CRUD.\n- **Accept:** an expired or minimum-unmet code is refused with a reason; the Razorpay amount reflects the discount.\n\n---\n\n## Out of scope (all versions)\nMarketplace / multi-brand · wishlists · reviews · multi-currency · shipping-rate APIs · marketing emails · COD · mobile owner console · real-money billing · storing shopper query photos · size recommendation · inventory across warehouses.\n"}, {"name": "03-user-flows", "path": "docs/03-user-flows.md", "md": "# Offcut — User Flows & Screen Index\n\n**Lifecycle step:** 3 of 17 · **Locked:** 2026-09-17 · Pairs with [03-requirements.md](03-requirements.md); every screen below gets a mockup in [04-ui-mockups.md](04-ui-mockups.md).\n\n## Flow 1 — Browse to paid (v1, the main path)\n\n```mermaid\nflowchart LR\n  H[S1 Home] --> C[S2 Collection · filters]\n  H --> Q[S3 Search results]\n  C --> P[S4 Product page]\n  Q --> P\n  P -->|More like this| P\n  P -->|Add to bag| B[S5 Bag drawer]\n  B -->|Checkout| K[S6 Checkout]\n  K -->|POST /checkout · reserve| RZ[Razorpay modal]\n  RZ -->|verify HMAC| OK[S7 Order success]\n  RZ -->|dismissed| K\n  OK -->|Create account| A[S9 Account]\n  OK --> O[S8 Order page · timeline]\n```\n\n## Flow 2 — Order lifecycle (v1 state machine, v2 returns)\n\n```mermaid\nstateDiagram-v2\n  [*] --> pending_payment: POST /checkout (stock reserved)\n  pending_payment --> paid: verify or webhook payment.captured (reservation → decrement)\n  pending_payment --> expired: 15 min lazy expire_stale() (reservation released)\n  pending_payment --> cancelled: payment.failed / shopper cancels\n  paid --> packed: owner\n  packed --> shipped: owner (+ courier, tracking id)\n  shipped --> delivered: owner\n  paid --> cancelled: owner (Razorpay refund)\n  delivered --> return_requested: shopper ≤ 7 days (v2)\n  return_requested --> returned: owner approve → refund, stock back (v2)\n  return_requested --> return_rejected: owner reject (v2)\n  note right of pending_payment\n    verify and webhook both call mark_paid(); second call is a no-op\n  end note\n```\n\n## Flow 3 — Reserve → pay → confirm (v1)\n\n```mermaid\nsequenceDiagram\n  participant S as Shopper (web)\n  participant API as FastAPI\n  participant PG as Postgres\n  participant RZ as Razorpay\n  S->>API: POST /checkout {cart, contact, address}\n  API->>PG: expire_stale(); lock variants (id order); reserved += qty where stock − reserved ≥ qty\n  PG-->>API: all lines ok (else 409 out_of_stock)\n  API->>RZ: create order (amount paise)\n  API->>PG: insert orders(pending_payment, razorpay_order_id)\n  API-->>S: {order_id, razorpay_order_id, key_id}\n  S->>RZ: Standard Checkout modal (test card)\n  RZ-->>S: {payment_id, signature}\n  S->>API: POST /checkout/{id}/verify\n  API->>PG: mark_paid(): paid; stock −= qty; reserved −= qty\n  RZ->>API: POST /webhooks/razorpay payment.captured\n  API->>PG: mark_paid() → already paid → no-op; webhook_events insert\n```\n\n## Flow 4 — Photo ingest: the image pipeline (v1)\n\n```mermaid\nflowchart TD\n  U[S13 Owner uploads photo] --> M[Pillow: sniff · EXIF orient + strip · ≤ 2000 px]\n  M --> T[ThumbHash + dominant colour]\n  M --> B[Vercel Blob put products/id/uuid.jpg]\n  M --> E[Jina jina-clip-v2 → 512-d · normalise]\n  T & B & E --> R[(product_photos: url · thumbhash · colour · embedding)]\n  R --> I[HNSW cosine index]\n  I -->|More like this v1| P[S4 Product page rail]\n  I -->|Shop the look v2| L[S15 Lens results]\n  I -->|Text search v2| Q[S3 Search results]\n  I -->|For you v3| H[S1 Home rail]\n```\n\n## Flow 5 — Shop the look (v2)\n\n```mermaid\nflowchart LR\n  D[S14 Lens · drop / paste / camera] --> Cr[S14 Crop step]\n  Cr -->|POST /lens/search · crop box| API[Sniff · crop · ≤ 1024 px · embed]\n  API --> V[(pgvector nearest 60 → group by product → top 12)]\n  V --> Res[S15 Results · match % · category chips]\n  Res --> P[S4 Product page]\n  P -->|Search from this photo| D\n```\n\n## Flow 6 — Owner: orders board (v1) and returns (v2)\n\n```mermaid\nflowchart LR\n  Bd[S12 Orders board] -->|open card| Dr[Order drawer]\n  Dr -->|legal transition only| T[POST /owner/orders/id/transition]\n  T -->|409 invalid_transition| Dr\n  T --> Bd\n  subgraph v2 returns\n    Sh[S8 Order page · Request return] --> RQ[return_requested]\n    RQ --> Dr2[Owner drawer · approve / reject]\n    Dr2 -->|approve| RF[Razorpay refund → returned · stock back]\n  end\n```\n\n## Screen index\n\n| # | Screen | Route | Who | Version | Notes |\n|---|---|---|---|---|---|\n| S1 | Home | `/` | shopper | v1 · For you in v3 | Exists as landing; becomes the store home (hero drop, categories, New in, Lens teaser) |\n| S2 | Collection | `/shop`, `/shop/[category]` | shopper | v1 | Grid, URL filters, sort |\n| S3 | Search results | `/search?q=` | shopper | v1 · hybrid in v2 | Full-text; v2 adds semantic hint |\n| S4 | Product page | `/p/[slug]` | shopper | v1 | Gallery blur-up, variants, stock, **More like this**; v2 \"Search from this photo\" |\n| S5 | Bag drawer | any page | shopper | v1 | Lines, stepper, stock re-check |\n| S6 | Checkout | `/checkout` | shopper | v1 · discounts in v3 | Contact, address, summary → Razorpay modal |\n| S7 | Order success | `/orders/[number]?key=` | shopper | v1 | Create-account offer |\n| S8 | Order page + Track | `/orders/[number]`, `/track` | shopper / guest | v1 · returns in v2 | Timeline; number + email lookup |\n| S9 | Account | `/account`, `/account/addresses` | shopper | v1 | Orders, address book |\n| S10 | Sign in / up | `/sign-in`, `/sign-up` | all | v1 | Demo buttons |\n| S11 | Owner: products | `/owner/products`, `/owner/products/[id]` | owner | v1 · near-dup in v3 | Table; editor with variant matrix |\n| S12 | Owner: orders board | `/owner/orders` | owner | v1 · returns in v2 | Columns by state, drawer with legal transitions |\n| S13 | Owner: photos + pipeline | `/owner/products/[id]` panel | owner | v1 | Drop zone, per-photo pipeline status (colour swatch, embedded ✓) |\n| S14 | Owner: inventory | `/owner/inventory` | owner | v1 · alerts in v3 | Stock / reserved / available, adjust with reason |\n| S15 | Lens: drop + crop | `/lens` | shopper | v2 · multi-crop in v3 | The signature screen |\n| S16 | Lens: results | `/lens` (state) | shopper | v2 · outfit board in v3 | Query pinned, 12 matches with %, chips |\n| S17 | Owner: dashboard | `/owner` | owner | v2 | Revenue, orders, top products, low stock |\n| S18 | Not found / sold out states | `/p/[slug]` states | shopper | v1 | Draft product 404; all-sold-out page |\n"}, {"name": "04-technical-design", "path": "docs/04-technical-design.md", "md": "# Offcut — Technical Design\n\n**Lifecycle step:** 4 of 17 · **Locked:** 2026-09-17 · UI companion: [04-ui-mockups.md](04-ui-mockups.md). Schema and routes: [06-data-and-api.md](06-data-and-api.md).\n\n## 1. Stack (shared stack, no deviations)\n| Layer | Choice | Notes |\n|---|---|---|\n| web/ | Next.js 15 App Router · TypeScript strict · Tailwind 4 · pnpm | UI only; `/api/*` rewritten to the API so cookies are same-origin. New: `thumbhash` (decode placeholder → data URL), `react-easy-crop` (v2) |\n| api/ | FastAPI (Python 3.12, uv) · SQLAlchemy 2.0 async + Alembic · pydantic · pytest | Vercel FastAPI preset, region `bom1`. New: **`Pillow`**, **`pgvector`** (SQLAlchemy `Vector` type), `httpx` (Jina), `thumbhash`, `razorpay` |\n| Data | Neon Postgres + **`pgvector`** extension | Catalogue, carts, orders, photos **with their embeddings** — one DB, no vector service |\n| Files | Vercel Blob | Product photos (pipeline output). Shopper query photos are never stored |\n| Embeddings | Jina `jina-clip-v2` over HTTPS | Image and text in one space; 512-d Matryoshka truncation; `normalized: true` |\n| Payments | Razorpay Standard Checkout + webhooks, test mode | Orders, verify, refunds (v2) |\n| Email (v2) | Resend + React Email | Order mails, returns, forgot-password |\n| Contract | `api/openapi.json` → `openapi-typescript` → `web/src/lib/api-types.ts` | `pnpm gen:api`; committed; not CI-gated |\n| CI | GitHub Actions: `web` (typecheck + build), `api` (ruff + pytest with a `pgvector/pgvector:pg17` service) | Nothing else |\n\n## 2. Catalogue model\n- `products` (slug, name, category, price_paise, description, tags, status draft|live) → `colourways` (name, hex, sort) → `variants` (colourway, size, sku, **stock**, **reserved**). Available = `stock − reserved`, computed in SQL, never stored.\n- `product_photos` (product, colourway nullable, url, width, height, **thumbhash**, **colour** hex, **embedding vector(512)**, model, dims, sort). The hero = lowest sort per colourway.\n- Full-text: `products.search tsvector` generated column (`name` A, `tags` B, `description` C) with a GIN index; `/search?q=` uses `websearch_to_tsquery('english', q)`.\n- Money is integer paise everywhere; the web formats ₹.\n\n## 3. The image pipeline (api, v1)\n`services/pipeline.py::ingest(product_id, colourway_id, file) → ProductPhoto`, called inline by `POST /owner/products/{id}/photos` (one call per file; the client sends files one at a time so a failure is per photo):\n\n1. **Sniff** the bytes with Pillow (`Image.open` + `format in {JPEG, PNG, WEBP}`), reject otherwise (415). Reject > 4 MB after the browser-side downscale (413).\n2. **Orient + strip:** `ImageOps.exif_transpose`, then re-encode without metadata (no GPS from the owner's phone).\n3. **Resize** so the longest side ≤ 2000 px (LANCZOS); encode JPEG q85 (PNG kept for transparent flats).\n4. **ThumbHash:** 100 px copy → `thumbhash.image_to_thumbhash` → ~25 bytes, base64 in the row. The web decodes it to a data URL for `next/image placeholder=\"blur\"`; no CLS because width/height are stored.\n5. **Dominant colour:** 64 px copy → `quantize(4)` → most-frequent palette entry → hex; mapped to one of 12 filter buckets (black, white, grey, olive, navy, …) in `colours.py`.\n6. **Blob:** `put('products/{product_id}/{uuid}.jpg')` via the Blob REST API (`httpx`) → public URL.\n7. **Embed:** `Embedder.embed_images([jpeg_bytes])` → 512 floats, L2-normalised → row insert. If Jina fails, the photo row is still written with `embedding null` and `embed_error`; the console shows \"retry embed\" (`POST …/photos/{id}/embed`).\n\n**Browser side (why):** Vercel functions cap request bodies at **4.5 MB**, so the owner console downsizes each picked file on a canvas to ≤ 2000 px JPEG (≈ 0.5–1.5 MB) before the POST; the picker itself accepts ≤ 8 MB. The API still runs every step above — the browser resize is a transport optimisation, not the pipeline. Same for v2 query photos: ≤ 5 MB picked, downscaled to ≤ 1024 px in the browser.\n\nSeed runs the identical function over `seed/photos/*.jpg`, so the seed is the pipeline's first integration test.\n\n## 4. Embedder\n```python\nclass Embedder(Protocol):\n    model: str; dims: int\n    async def embed_images(self, images: list[bytes]) -> list[list[float]]: ...\n    async def embed_texts(self, texts: list[str]) -> list[list[float]]: ...\n```\n`JinaEmbedder`: `POST https://api.jina.ai/v1/embeddings` `{ model: \"jina-clip-v2\", dimensions: 512, normalized: true, input: [{image: <base64>} | {text: \"…\"}] }`, `Authorization: Bearer $JINA_API_KEY`, timeout 20 s, one retry. Batches of ≤ 16 images. Fallback documented in the PRD: `VoyageEmbedder` (`voyage-multimodal-3`, 1024-d → would need `dims` 1024 and a re-embed via `seed embed --all`). Tests use `FakeEmbedder` (deterministic hash → unit vector) so CI never calls the network.\n\n## 5. Vector queries (api)\nOne SQL for every feature (`services/search.py::nearest(query_vec, exclude_product=None, category=None, k=12)`):\n```sql\nwith hits as (\n  select p.product_id, 1 - (p.embedding <=> $1) as score\n  from product_photos p join products pr on pr.id = p.product_id\n  where pr.status = 'live' and p.embedding is not null\n    and ($2::uuid is null or p.product_id <> $2)\n    and ($3::text is null or pr.category = $3)\n  order by p.embedding <=> $1 limit 60)\nselect product_id, max(score) as score from hits group by product_id order by score desc limit $4;\n```\nIndex: `create index on product_photos using hnsw (embedding vector_cosine_ops)` (`m 16, ef_construction 64`; ~100 rows means the index is a formality in v1, but it is the same index at 10k). `SET hnsw.ef_search = 100` per query.\n- **More like this (v1):** `query_vec` = the product's hero photo embedding; `exclude_product` = itself; k = 8. Cached at the edge for 5 min (`s-maxage=300`) since the catalogue changes rarely.\n- **Shop the look (v2):** `query_vec` = embed of the shopper's crop; optional `category` from the chips (re-query, not client filter, so the 60-cap doesn't starve a category).\n- **Text (v2):** `embed_texts([q])` → same query, then reciprocal-rank fusion with the FTS ranking: `score = Σ 1/(60 + rank_i)`.\n- **For you (v3):** mean of the hero embeddings of the last 20 viewed products, re-normalised; exclude viewed.\n\n## 6. Cart, checkout, orders (api)\n- **Cart:** `carts(id, user_id null, token)`; cookie `oc_cart` = token (30 d). Sign-in: if the user already has a cart, merge lines (sum, clamp to available) and delete the guest cart; else attach. Cart reads join variants for live price and available stock; no price is stored in the cart.\n- **Checkout** (`POST /checkout`): in one transaction — `expire_stale()` → `select … from variants where id = any($ids) order by id for update` → per line `update variants set reserved = reserved + $qty where id = $id and stock − reserved ≥ $qty` (rowcount 0 → rollback, `409 out_of_stock { variant_id }`) → snapshot lines into `order_lines` (name, size, colour, unit_paise) → `orders(pending_payment, subtotal, delivery = 9900 or 0 over 199900, total)` → Razorpay `order.create(amount=total, receipt=number)` → store `razorpay_order_id` → commit. Returns `{ order_id, number, key_id, razorpay_order_id, amount }`.\n- **Confirm:** `POST /checkout/{id}/verify { payment_id, signature }` → `hmac.sha256(secret, f\"{rz_order_id}|{payment_id}\") == signature` → `mark_paid(order, payment_id)`: `select … for update`; if `pending_payment` → `paid`, and per line `stock −= qty, reserved −= qty`; else no-op. The webhook route verifies `X-Razorpay-Signature` over the raw body with the webhook secret, inserts `webhook_events(id)` (unique → replay = 200 no-op), then dispatches `payment.captured → mark_paid`, `payment.failed → cancel if still pending`.\n- **Expiry:** `expire_stale()` = `update orders set state='expired' where state='pending_payment' and created_at < now() − interval '15 min' returning id` → release each line's reservation. Called at the top of `POST /checkout`, `GET /orders/{n}` and the owner's board load. No cron.\n- **Transitions** (`services/orders.py::TRANSITIONS`): `{pending_payment: [paid, expired, cancelled], paid: [packed, cancelled], packed: [shipped], shipped: [delivered], delivered: [return_requested (v2)], return_requested: [returned, return_rejected]}`; `paid → cancelled` and `return_requested → returned` call Razorpay `payment.refund` first and store the refund id. Every transition writes `order_events(order_id, from, to, actor, note)` — the shopper's timeline.\n- **Order access:** signed-in owner of the order, or `?key=` (random 32-char token on the order, in the success URL and the v2 email), or `/track` with number + email (rate-limited 10/min/IP).\n\n## 7. Web\n- **Rendering:** home and collection pages are dynamic with `fetch` cached by tag (`products`) and `revalidate: 300`; the owner console calls `POST web/api/revalidate` on product/photo/stock writes. Product page: ISR by tag `product:{slug}`. Cart, checkout, orders, account, owner: dynamic, `no-store`. `next/image` with `remotePatterns` for the Blob host, `sizes` per grid, `placeholder=\"blur\"` from ThumbHash.\n- **Filters** live in the URL (`nuqs`-style, hand-rolled): `/shop/tees?size=M&colour=olive&max=2500&sort=new`; the grid is a server component; the filter bar is a client component that pushes the URL (no reload, `router.replace` with scroll false).\n- **Bag drawer:** client store (`useCart`) hydrated from `GET /cart`; optimistic add; revalidated on open.\n- **Checkout:** one client component; loads `checkout.js` (Razorpay) lazily on the page; `Pay` → `POST /api/checkout` → `new Razorpay(options).open()` → handler → `POST /api/checkout/{id}/verify` → `router.push` to success; `ondismiss` shows \"Payment not completed — stock is held for 15 min\".\n- **Owner console:** `app/(owner)/owner/*` behind a layout that 404s non-owners; product editor = one form with a variant matrix (sizes × colourways, stock inputs); photo panel posts files sequentially with per-file progress and pipeline result (swatch, ThumbHash preview, embedded ✓).\n- **Share target (v4):** `manifest.webmanifest` with `share_target` (POST multipart, `files: photo`); `sw.js` handles the share POST (`event.request.formData()` → `caches.open('share').put('/shared-photo', new Response(file))` → `Response.redirect('/lens?shared=1')`); `/lens` on `?shared=1` reads the cached file, deletes it, and enters the crop step. App shell precached (`/lens`, fonts, icons) so the share sheet works offline until the search call.\n- **Lens (v2):** `app/(shop)/lens` client page: drop zone with `paste` listener and `capture=\"environment\"` input; canvas downscale to ≤ 1024 px; `react-easy-crop` → crop box in *source* pixels; `POST /api/lens/search` multipart; results grid. The signature motion (chosen in [04-ui-mockups.md](04-ui-mockups.md)) plays between submit and results.\n- **Motion signature and visual direction:** decided in [04-ui-mockups.md](04-ui-mockups.md) from 3–4 variants. On the table: *Scan* (acid scanline over the query photo, matches tile in ranked), *Cut* (page transitions cut along a dashed line), *Swatch* (product tiles flip through colourways on hover), *Ticker* (stock/price tickers).\n\n## 8. Auth & access\nOwn session auth (as the other projects): `users(email, password_hash argon2, name, role shopper|owner)`, `sessions(id, user_id, expires_at)`, cookie `oc_session` HttpOnly SameSite=Lax 30 d. `POST /auth/demo { as: shopper|owner }` for the landing buttons. Owner routes depend on `require_owner` (404 otherwise). Guest order reads use the order `key`.\n\n## 9. Caching & rendering\nHome / collection / product: tag-cached with a 5-min revalidate; API `GET /products*` and `/products/{slug}/similar` send `s-maxage=300, stale-while-revalidate=600`. Cart, checkout, orders, owner, lens: `no-store`. Landing (marketing sections) static.\n\n## 10. Failure modes worth handling\n| Failure | Behaviour |\n|---|---|\n| Jina down during ingest | Photo saved without embedding + `embed_error`; console offers retry; the product still sells |\n| Jina down during Lens search (v2) | 503 `search_unavailable`, page shows \"Try again in a moment\" and the text search link |\n| Lens monthly cap reached (v2) | 429 `lens_paused` — \"Lens is resting until the 1st\"; text search and More like this keep working (stored vectors, no call) |\n| Share target on iOS (v4) | Safari has no Web Share Target; the Lens shows the paste / picker path and hides the install card |\n| Razorpay modal dismissed | Order stays `pending_payment` 15 min; checkout page can re-open the modal for the same order (no second reservation) |\n| Verify never arrives (tab closed) | Webhook `payment.captured` marks paid; the order email (v2) / account shows it |\n| Webhook before verify / replayed | `mark_paid` idempotent; `webhook_events.id` unique |\n| Stock adjusted below `reserved` | 409 `below_reserved` in the console |\n| Blob put fails | 502 `storage_failed`; nothing written; the client retries that file |\n| Body > 4.5 MB | Prevented client-side by the canvas downscale; API returns 413 regardless |\n\n## 11. Testing (only these)\n- `test_reserve_last_unit_race`: stock 1, two concurrent `POST /checkout` (`asyncio.gather`) → one 200, one 409; `reserved` = 1.\n- `test_mark_paid_idempotent`: verify then webhook, and webhook then verify → one decrement; replayed webhook → 200, no change.\n- `test_expire_stale`: pending order aged 16 min → `expired`, reservation released.\n- `test_transitions`: every edge in `TRANSITIONS` allowed; `shipped → packed` → 409; `paid → cancelled` calls the refund stub.\n- `test_pipeline`: a fixture JPEG with EXIF rotation → oriented, ≤ 2000 px, no EXIF, ThumbHash present, hex colour, 512-d unit vector (`FakeEmbedder`); a GIF → 415.\n- `test_similar_excludes_self`: nearest never returns the query product; category filter honoured.\n- `test_cart_merge`: guest cart + user cart → summed, clamped to available.\n- v2: `test_return_refund_amount`, `test_rrf_fusion_order`; `scripts/eval_lens.py` over the 10 held-out photos (report, not CI).\n\n## 12. Environment\n`api/`: `DATABASE_URL`, `SESSION_SECRET`, `WEB_URL`, `REVALIDATE_SECRET`, `BLOB_READ_WRITE_TOKEN`, `JINA_API_KEY`, `RAZORPAY_KEY_ID`, `RAZORPAY_KEY_SECRET`, `RAZORPAY_WEBHOOK_SECRET`; v2: `RESEND_API_KEY`. `web/`: `API_URL`, `REVALIDATE_SECRET`, `NEXT_PUBLIC_RAZORPAY_KEY_ID`, `NEXT_PUBLIC_BLOB_HOST`.\n"}, {"name": "04-ui-mockups", "path": "docs/04-ui-mockups.md", "md": "# Offcut — UI Mockups\n\n**Lifecycle step:** 4 of 17 (UX companion to the technical design) · **Brief locked:** 2026-09-17 · **Variants:** built 2026-09-17 — `mockups/direction-variants.html`, published at https://claude.ai/artifact/GXn8tPnv8uMhKXMxjtZeoG (round 2: eight directions, six screens) · **Chosen: H · Court** (Viraj, 2026-09-17)\n**Pairs with:** [03-user-flows.md](03-user-flows.md) — one mockup per v1 screen (S1–S14, S18) after the direction is chosen; S15–S16 (Lens) are mocked with v1 because the direction is judged on them.\n**Files:** `mockups/landing.html` (exists, already ported to `web/`) → `mockups/direction-variants.html` (S4 product page + S16 Lens results on a 390 px phone, S2 collection at desktop, 3–4 directions) → `mockups/screens.html` (every v1 screen in the chosen direction) → `mockups/tracker.html` (built by `mockups/tracker-build.py`).\n**Published:** [Direction variants](https://claude.ai/artifact/GXn8tPnv8uMhKXMxjtZeoG) · [Screens](https://claude.ai/artifact/QRyBudWEkRwfHRsW8DGmvH) · Tracker — link in [07-plan.md](07-plan.md).\n\n## Brief\n**Style:** the existing landing sets the brand — **Archivo** (variable width, 62–125), black `#000`, white `#FFF`, acid `#D6FF3B`, grey `#5E5E5E`, 2 px black rules, uppercase 900-weight headings at line-height .9, a marquee. Streetwear brands earn trust with restraint and confidence: big type, hard edges, photography doing the talking. Keep the black/white/acid system; the variants explore the one question that matters for a store with a camera in it: **how does the product photography sit against the chrome, and what does \"the store is looking at your photo\" feel like.**\n\n**The product page and the Lens results are the product.** Photos must be the biggest thing on every shopper screen; chrome is rules and type. The owner console is the same system in a denser, calmer register (tables, matrices, pipeline status) — it must feel like the same brand, not an admin template.\n\n**Real content:** the seed catalogue — CC streetwear photos from Wikimedia Commons (tees, hoodies, jackets, cargo trousers, caps, sneakers), one outfit photo as the Lens query, credits in `mockups/img/CREDITS.md`. Prices in ₹ (₹1,299 tee, ₹2,999 hoodie, ₹4,499 jacket). Sizes S–XL with one sold out.\n\n## Motion signature — pick one in the variant page\n| Candidate | What happens | Reduced-motion fallback |\n|---|---|---|\n| **A · Scan** | On submit, an acid scanline sweeps the query photo top→bottom (700 ms) leaving a faint grid; as it passes, matches tile in from the right in rank order, each match % counting up from 0 (stagger 60 ms). The crop box outline \"locks\" with a 2-frame flash. | Photo dims 20 %, results fade in together |\n| **B · Cut** | Page transitions are a cut: a dashed line draws across the viewport (300 ms), the old page splits along it and the two halves slide apart, the new page is underneath. Product tiles on hover show a dashed \"cut here\" corner. | Cross-fade 150 ms |\n| **C · Swatch** | Hovering / focusing a product tile flips it through its colourways like fabric swatches (each 120 ms, `rotateY`), settles on the last; the colour dots under the title track it. Size buttons stamp in on the product page. | Static tile; dots only |\n| **D · Ticker** | Prices, stock (\"3 left\"), and match % render as split-flap tickers: digits roll when they change (adding to bag rolls the subtotal; the Lens % rolls up from 00). Marquee stays. | Digits change instantly |\n\nRecommendation was A · Scan + D · Ticker. Round 2 added four more candidates (Reveal, Fly to bag + Stitch, Focus, Stamp + Pop) with the four new styles. **Viraj chose H · Court (2026-09-17)**: signature = **the Scan with Stamp + Pop** (scanline sweeps the query photo, the match count stamps in, tiles pop with overshoot and their % counts up); v1 touch = **Fly to bag + Ticker** (the photo arcs into the bag pill, the pill bumps, the subtotal rolls); hover lifts every tile off its hard shadow. Cut, Swatch, Reveal, Focus dropped.\n\n## Variant page (`mockups/direction-variants.html`) — round 1, built\nFour full-size directions of **S4 product page** (desktop 1280, scaled to fit) with **S16 Lens results** on a 390 px phone beside it, and **S2 collection** below, behind an A/B/C/D tab strip (keys 1–4). Each direction demonstrates one motion candidate live; the Scan plays on every phone since it is the wow whichever chrome wins. Directions:\n\n| Direction | Chrome | Photography | Idea |\n|---|---|---|---|\n| **A · Rulebook** | The landing's system as-is: white, 2 px black rules, boxed grid, acid only on actions and labels | Photos boxed by rules, 4:5, no radius | The brand's own grid — Swiss streetwear. **Demonstrates D · Ticker:** Add to bag rolls the subtotal |\n| **B · Blackout** | Black chrome, white type, acid accents; photos glow on black | Photos edge-to-edge in a dark gallery | Night drop. **Demonstrates A · Scan** on its native ground |\n| **C · Paper stock** | Off-white `#F2F0EA`, thin 1 px rules, huge condensed headings, mono labels (JetBrains Mono) for SKUs, sizes, % | Photos sit on the paper like a lookbook spread, staggered grid | Lookbook / zine; product data in mono reads \"engineered\". **Demonstrates C · Swatch:** hover flips a tile through its colourways |\n| **D · Acid sheet** | White with acid section bands and acid selection; oversized wordmarks bleeding off | Photos stacked with sticker-style labels | Loudest; risks fighting the photos. **Demonstrates B · Cut:** the product page is cut along a dashed line to reveal the collection |\n\nEach direction carries the same photos and copy; only the chrome and the demonstrated motion change. `prefers-reduced-motion` respected in all.\n\n## Variant page — round 2 (Viraj: \"all look the same… check more UI styles\", \"try more animations\")\nSix screens per tab (S4 + S16, S1 + S6, S2, owner console S11/S13) and four styles that are not chrome swaps of the streetwear system:\n\n| Direction | Style | Motion |\n|---|---|---|\n| **E · Gallery** | Ivory, hairlines, Cormorant Garamond headings, letter-spaced light Archivo, accent = ink (no acid). SSENSE / COS | **Reveal** — photos wipe up on entry; hover = slow zoom, siblings dim |\n| **F · Clay** | Sand ground, terracotta, Fraunces serif, 14 px radius, pill buttons, soft shadows. Warm craft brand | **Fly to bag** + **Stitch** (dashed thread tightens around a hovered tile) |\n| **G · Lens app** | Cool grey, electric blue, Plus Jakarta Sans sentence case, elevated cards, pill sizes/chips. Product app | **Focus** — the scan is a focus pull with viewfinder brackets; results pop with a spring; tiles lift |\n| **H · Court** | Cream `#FFF6E0`, navy `#1B1B6F` 3 px borders with offset hard shadows, red `#E63B2E` + yellow `#F6C90E` blocks, Archivo at wdth 125. Retro 90s sportswear catalogue | **Stamp** + **Pop**; hover lifts a tile off its shadow |\n\nSwitching tabs replays a staggered entrance in each direction's idiom; Add to bag does Ticker + Fly to bag in every tab.\n\n## Chosen direction — H · Court (locked 2026-09-17)\n**Idea:** a 90s sportswear catalogue you can buy from. Cream paper, navy ink, every object is a card with a 3 px navy border and a hard offset shadow — a sticker on a sheet. Red and yellow do the pointing (actions, tags, stamps); the photos stay the biggest thing on every screen. Archivo at its widest for headings and the wordmark; the same face at normal width for everything else, so the brand is one family. The owner console is the same sheet at a calmer density.\n\n### Tokens (→ `web/src/app/globals.css`)\n| Token | Value | Use |\n|---|---|---|\n| `--bg` / `--panel` / `--tile` | `#FFF6E0` / `#FFFFFF` / `#FFE9B8` | page ground / cards, drawers, header / image placeholders, hover fills |\n| `--ink` / `--ink-2` / `--muted` | `#1B1B6F` / `#2E2E7A` / `#5B5B8C` | text, borders, shadows / secondary / labels (≥ 4.5:1 on cream) |\n| `--line` · `--lw` | `#1B1B6F` · `3px` | every border; hard shadows `5px 5px 0 var(--line)` on tiles, `6px 6px 0` on cards |\n| `--red` | `#E63B2E` | primary action fill, sold-out, stamps, match badges, destructive |\n| `--yellow` | `#F6C90E` | selected state (size, chip, nav item), bag pill, low-stock, \"Drop 04\" tags, the Lens scanline |\n| radii | tiles / cards 8 px · buttons / pills 8 px · phone 44 px | rounded just enough to read as stickers |\n| type | **Archivo** variable — headings 900 at wdth 125, uppercase, tracking −.01em · body 400–800 at wdth 100 · **JetBrains Mono** 400/500 for SKUs, match %, pipeline status, order numbers | `next/font/google`, `display: swap` |\n| grid | shop 4 columns at ≥ 1280 (gap 22 px, shadow room 8 px), 2 on phone; product page 1.25 fr / 1 fr; console 220 px sidebar + fluid | |\n\n### Motion (all with `prefers-reduced-motion` fallbacks)\n| Moment | Spec | Reduced |\n|---|---|---|\n| **Scan (signature, v2)** | red scanline sweeps the query photo top→bottom 700 ms linear with a faint red grid; at 720 ms the match count **stamps** in (scale 1.9 → .94 → 1, rotate −8° → 2°, 500 ms `cubic-bezier(.2,1.4,.4,1)`), then tiles **pop** in rank order (scale .6 → 1, 500 ms `cubic-bezier(.34,1.56,.64,1)`, stagger 70 ms) while each % counts up from 00 over 600 ms | photo dims, results fade in together, numbers set instantly |\n| Fly to bag (v1) | on Add to bag a 90 × 112 clone of the hero photo arcs to the bag pill (720 ms, mid-point 160 px above the line, scale 1 → .12), the pill bumps (scale 1.18, 450 ms spring) and the subtotal rolls | no clone; subtotal changes instantly |\n| Ticker (v1) | digits are 0–9 columns translating `translateY(−n × 1.1em)`, 550 ms `cubic-bezier(.2,.8,.2,1)` — bag subtotal, \"3 left\", order totals | instant |\n| Tile hover | `translate(−3px, −3px)` and shadow `8px 8px 0`, 180 ms; buttons `−2px` and `6px 6px 0` | none |\n| Page entrance | tiles / cards pop in with the same overshoot, stagger 45 ms, on first paint of a route | fade |\n| Sold-out / 404 | the stamp (rotated −4°, 4 px border) with no animation — it's a state, not an event | — |\n| Marquee | 24 s linear loop, yellow band | static |\n\n### Browser surfaces\n`::selection` yellow with navy ink · scrollbar: cream track, navy thumb, 10 px, square · focus ring 3 px yellow, offset 2 px · `caret-color` navy · `theme-color` `#FFF6E0` · favicon = the mark with the yellow corner.\n\n## Screens (`mockups/screens.html`) — built 2026-09-17\nEvery v1 screen from the screen index in Court, plus the Lens: S1 home, S2 collection (desktop + phone), S3 search results, S4 product page (desktop with Fly to bag + Ticker live, phone), S5 bag drawer, S6 checkout (desktop + phone), S7 order success, S8 order page + track, S9 account, S10 sign in/up, S11 owner products, S13 owner editor + photo pipeline, S12 owner orders board with the transition drawer, S14 owner inventory, S15/S16 Lens (drop, crop, results with the Scan), S18 states (sold out, draft 404, empty search). Published at https://claude.ai/artifact/QRyBudWEkRwfHRsW8DGmvH. **Step 4 complete.**\n"}, {"name": "05-architecture", "path": "docs/05-architecture.md", "md": "# Offcut — Architecture\n\n**Lifecycle step:** 5 of 17 · **Locked:** 2026-09-17\n\n## 1. System diagram\n\n```mermaid\nflowchart LR\n  subgraph Browser\n    SH[Shopper · phone<br/>shop · bag · checkout · lens]\n    OW[Owner console · desktop<br/>products · photos · stock · orders]\n  end\n  subgraph Vercel\n    WEB[web · offcut<br/>Next.js: shop (tag-cached) · account · owner · lens<br/>rewrites /api/* →]\n    API[api · offcut-api<br/>FastAPI bom1 · Pillow · pgvector<br/>REST + webhooks]\n  end\n  PG[(Neon Postgres + pgvector<br/>products · variants · photos+embeddings<br/>carts · orders · events)]\n  BL[Vercel Blob<br/>product photos]\n  JN[Jina · jina-clip-v2<br/>image + text embeddings]\n  RZ[Razorpay<br/>orders · payments · refunds]\n  RS[Resend · v2]\n\n  SH -->|same-origin /api/*| WEB --> API\n  OW --> WEB\n  SH -.->|Standard Checkout modal| RZ\n  API --> PG\n  API -->|put photo| BL\n  API -->|embed at ingest · at search| JN\n  API -->|create order · refund| RZ\n  RZ -->|payment.captured webhook| API\n  API -->|revalidate tags| WEB\n  API -->|order mails| RS\n  BL -->|next/image| SH\n```\n\n## 2. Boundaries\n| Component | Owns | Never does |\n|---|---|---|\n| **web/** | Every screen; the bag store; URL filters; the Razorpay modal; the Lens crop UI and browser-side downscale; ThumbHash → data URL | Touch the DB, Blob, Jina or Razorpay's server API; compute prices or stock |\n| **api/** | Auth, catalogue, carts, reservations, orders and their state machine, the image pipeline, embeddings, vector queries, Razorpay orders / verify / webhooks / refunds, uploads, seed | Render HTML; keep an in-memory index; store shopper query photos |\n| **Postgres (+pgvector)** | Everything durable, including the vectors and the HNSW index | Serve image bytes |\n| **Blob** | Product photo bytes (pipeline output only) | Originals, query photos |\n| **Jina** | Turning bytes / text into 512-d vectors | Ranking (that is pgvector's) |\n| **Razorpay** | Taking the money, telling us via webhook | Deciding stock — reservation is ours |\n\nContract: `api/openapi.json` → `web/src/lib/api-types.ts` via `pnpm gen:api`. Web client (`web/src/lib/api.ts`) = typed `fetch` forwarding cookies, trusting only the `{ error: { code, message, details } }` envelope.\n\n## 3. api/ layout\n```\napi/app/\n  main.py            app factory, request-id middleware, error envelope\n  config.py          pydantic-settings\n  db.py              async engine; `create extension if not exists vector` in 0001\n  colours.py         hex → 12 filter buckets\n  models/            user, session, product, colourway, variant, product_photo (Vector(512)), cart, cart_line,\n                     order, order_line, order_event, address, webhook_event, inventory_move,\n                     return (v2), discount (v3)\n  schemas/           pydantic request/response models (= the OpenAPI contract)\n  routers/           auth, catalog (products, search, similar), cart, checkout, orders, account,\n                     owner (products, photos, inventory, orders, dashboard v2), lens (v2), webhooks\n  services/\n    pipeline.py      Pillow → thumbhash → colour → Blob → embed\n    embedder.py      Embedder protocol · JinaEmbedder · FakeEmbedder (tests)\n    search.py        nearest(); fts(); rrf() (v2)\n    blob.py          Blob REST put / delete\n    cart.py          merge, clamp\n    checkout.py      expire_stale, reserve, create order, mark_paid\n    orders.py        TRANSITIONS, transition(), refunds\n    razorpay.py      order create, signature verify, webhook verify, refund\n  seed/              catalog.json · fetch_photos.py · photos/ (+ CREDITS.md) · queries/ (10 held-out) · seed.py\nscripts/             eval_similar.py · eval_lens.py (v2)\ntests/               the tests listed in 04 §11 only\n```\n\n## 4. web/ layout\n```\nweb/src/\n  app/(shop)/            page.tsx (home) · shop/[[...category]] · search · p/[slug] · lens (v2) · track · orders/[number]\n  app/(account)/         sign-in · sign-up · account · account/addresses · checkout\n  app/(owner)/owner/     layout (404 non-owners) · page (dashboard v2) · products · products/[id] · inventory · orders\n  app/api/revalidate/    route.ts\n  components/shop/       ProductCard · ProductGrid · FilterBar · Gallery · VariantPicker · SimilarRail · BagDrawer · Price (ticker)\n  components/checkout/   CheckoutForm · RazorpayButton · OrderTimeline\n  components/owner/      ProductForm · VariantMatrix · PhotoPanel (pipeline status) · InventoryTable · OrdersBoard · OrderDrawer\n  components/lens/       DropZone · Cropper · Scan (signature) · Results (v2)\n  components/landing/    (exists)\n  components/ui/\n  lib/api.ts · api-types.ts (generated) · session.ts · cart-store.ts · thumbhash.ts · money.ts · filters.ts · image-downscale.ts\n```\n\n## 5. Deployment topology\n- Two Vercel projects per repo (as the other projects): `offcut` (root `web/`) and `offcut-api` (root `api/`, FastAPI preset, `bom1`). `web/next.config.ts` rewrites `/api/:path*` → `API_URL`; cookies are first-party; no CORS.\n- Neon: one project with `pgvector` enabled; `main` = production, a `dev` branch for local; CI uses the `pgvector/pgvector:pg17` image.\n- Blob store on `offcut-api`; `NEXT_PUBLIC_BLOB_HOST` in `remotePatterns`.\n- Razorpay test mode; webhook → `https://offcut.virajdomadia.com/api/webhooks/razorpay` (via the web rewrite so the URL survives an API host change).\n- Previews: Vercel previews per PR for `web/` against the production API.\n- CI (GitHub Actions): `web` = pnpm typecheck + build; `api` = ruff + pytest with the pgvector Postgres service. That is all.\n\n## 6. Request paths worth drawing\n**Ingest:** owner drops a 6 MB phone photo → canvas downscale to 2000 px (~1 MB) → `POST /api/owner/products/42/photos` → Pillow (orient, strip, resize) → ThumbHash + colour → Blob put → Jina embed (≈ 600 ms) → `product_photos` insert → `POST web/api/revalidate tag=product:boxy-tee-03` → the console shows swatch + ✓.\n**Buy:** `/p/boxy-tee-03` (ISR by tag) → Add to bag → `POST /api/cart/lines` → Checkout → `POST /api/checkout` (expire_stale, lock, reserve, Razorpay order) → modal → `POST /api/checkout/{id}/verify` → `mark_paid` → `/orders/OC-1042?key=…`; Razorpay's webhook arrives seconds later → no-op.\n**More like this:** product page server component → `GET API/products/boxy-tee-03/similar` (`s-maxage=300`) → hero embedding → HNSW nearest 60 → group → 8 cards.\n**Lens (v2):** paste → downscale 1024 px → crop → `POST /api/lens/search` → Pillow crop → Jina embed → nearest → 12 matches with scores → the Scan plays over the ~1 s round trip.\n\n## 7. Security notes (the short list)\nCookie session HttpOnly + SameSite=Lax; argon2 passwords; owner routes 404 for non-owners; prices and delivery computed server-side from the DB at checkout (the client never sends amounts); Razorpay signature checked on verify and on the webhook, event ids deduped; order `key` is a 32-char random token, `/track` rate-limited; uploads type-sniffed, size-capped, EXIF-stripped, owner-only; query photos processed in memory only; Blob URLs are unguessable but public (product photos are public anyway); no PII in logs; the eval scripts never run against production.\n"}, {"name": "06-data-and-api", "path": "docs/06-data-and-api.md", "md": "# Offcut — Database + API Design\n\n**Lifecycle step:** 6 of 17 · **Locked:** 2026-09-17 · Behaviour in [04-technical-design.md](04-technical-design.md). Alembic `0001_v1` creates everything under **A** (and `create extension if not exists vector`); v2/v3 tables get their own migrations.\n\n## A. Postgres schema (v1)\n\n```sql\ncreate extension if not exists vector;\ncreate type user_role      as enum ('shopper','owner');\ncreate type product_status as enum ('draft','live');\ncreate type order_state    as enum ('pending_payment','paid','packed','shipped','delivered','expired','cancelled',\n                                    'return_requested','returned','return_rejected');          -- last three used from v2\ncreate type category       as enum ('tees','hoodies','jackets','trousers','shorts','caps','sneakers','bags');\n\nusers          (id uuid pk, email citext unique, password_hash text, name text, phone text null, role user_role default 'shopper', created_at)\nsessions       (id text pk, user_id uuid fk, expires_at timestamptz, created_at)                     index (user_id)\naddresses      (id uuid pk, user_id uuid fk, name, phone, line1, line2 null, city, state, pin char(6), is_default bool, created_at)  index (user_id)\n\nproducts       (id uuid pk, slug citext unique, name text, category category, price_paise int, description text, tags text[],\n                status product_status default 'draft', created_at, updated_at,\n                search tsvector generated always as (setweight(to_tsvector('english', name),'A') ||\n                                                     setweight(to_tsvector('english', array_to_string(tags,' ')),'B') ||\n                                                     setweight(to_tsvector('english', description),'C')) stored)\n                index gin (search) · index (category, status)\ncolourways     (id uuid pk, product_id fk, name text, hex text, sort int)                              index (product_id)\nvariants       (id uuid pk, product_id fk, colourway_id fk, size text, sku text unique,\n                stock int default 0 check (stock >= 0), reserved int default 0 check (reserved >= 0 and reserved <= stock))\n                unique (colourway_id, size) · index (product_id)\nproduct_photos (id uuid pk, product_id fk, colourway_id fk null, url text, width int, height int,\n                thumbhash text, colour text, colour_bucket text, embedding vector(512) null, model text, dims int,\n                embed_error text null, sort int, created_at)\n                index (product_id, sort) · index hnsw (embedding vector_cosine_ops) with (m = 16, ef_construction = 64)\ninventory_moves (id uuid pk, variant_id fk, delta int, reason text, actor_id fk, created_at)          index (variant_id)\n\ncarts          (id uuid pk, user_id uuid fk null unique, token text unique null, created_at, updated_at)\ncart_lines     (cart_id fk, variant_id fk, qty int check (qty > 0), primary key (cart_id, variant_id))\n\norders         (id uuid pk, number text unique,                     -- 'OC-1042', sequence-backed\n                user_id uuid fk null, email citext, phone text, key text,   -- key: 32-char guest access token\n                state order_state, address jsonb, subtotal_paise int, delivery_paise int, discount_paise int default 0, total_paise int,\n                razorpay_order_id text unique, razorpay_payment_id text null, refund_id text null,\n                courier text null, tracking_id text null, created_at, paid_at null, updated_at)\n                index (user_id, created_at desc) · index (state, created_at) · index (email)\norder_lines    (id uuid pk, order_id fk, variant_id fk, product_id fk, name text, size text, colour text, photo_url text,\n                qty int, unit_paise int)                                                                index (order_id)\norder_events   (id uuid pk, order_id fk, from_state order_state null, to_state order_state, actor text, note text null, created_at)\n                index (order_id, created_at)\nwebhook_events (id text pk, event text, received_at)\n```\n\nAvailable stock is always `stock − reserved` in SQL; the `reserved ≤ stock` check makes \"adjust below reserved\" impossible at the DB too. Photos carry `model` + `dims` so a provider swap re-embeds by filter, not by migration. `orders.address` is a snapshot (jsonb) so an address-book edit never rewrites history; `order_lines` snapshot name / size / colour / price for the same reason.\n\n**Reservation recipe** (checkout and expiry share it):\n```sql\nbegin;\n  update orders set state = 'expired' where state = 'pending_payment' and created_at < now() - interval '15 min' returning id;  -- then release each line\n  select id, stock, reserved from variants where id = any($ids) order by id for update;\n  update variants set reserved = reserved + $qty where id = $id and stock - reserved >= $qty;   -- rowcount 0 → rollback 409\n  insert into orders (...) values (... 'pending_payment' ...);\n  insert into order_lines (...);\ncommit;\n-- mark_paid (verify or webhook), under `select ... from orders where id = $1 for update`:\n  update variants v set stock = v.stock - l.qty, reserved = v.reserved - l.qty from order_lines l where l.variant_id = v.id and l.order_id = $1;\n  update orders set state = 'paid', razorpay_payment_id = $2, paid_at = now() where id = $1 and state = 'pending_payment';\n```\n\n**v2 additions:** `returns (id, order_id fk, order_line_id fk, reason text, state text, refund_id text null, decided_by fk null, created_at, decided_at null)` index (order_id); `email_log (id, order_id fk, kind text, sent_at)`; `users.reset_token`, `reset_expires_at`.\n**v2 additions (cont.):** `usage_counters (month char(7) pk, lens_queries int)` — the Lens budget guard; `rl:lens:{ip}` 60 s int (10/min).\n**v3 additions:** `discounts (code citext pk, type text, value int, min_order_paise int, expires_at, uses int, max_uses int null)`; `orders.discount_code`; `product_photos.duplicate_of uuid null` (recorded when the owner reuses instead of uploading).\n\n## B. Blob keys\n| Prefix | Written by | Deleted when |\n|---|---|---|\n| `products/{product_id}/{uuid}.jpg` | `services/pipeline.py` (owner upload, seed) | Photo deleted in the console / product deleted |\n\nNothing else is stored in Blob. Query photos (v2) never touch it.\n\n## C. REST API (`/api/*` from the browser; FastAPI serves `/docs`)\n\nError envelope everywhere: `{ \"error\": { \"code\": \"out_of_stock\", \"message\": \"…\", \"details\": {…} } }`. Auth via cookie; `🔒` = signed in, `👑` = owner (404 otherwise), `🔑` = order `key` or owner of the order, `⚙` = server-to-server. Money fields are paise integers.\n\n### Auth\n| Method | Path | Body → Returns |\n|---|---|---|\n| POST | `/auth/sign-up` | `{ email, password, name }` → `Me` (merges the guest cart) |\n| POST | `/auth/sign-in` | `{ email, password }` → `Me` (merges the guest cart) |\n| POST | `/auth/sign-out` | → 204 |\n| GET | `/auth/me` | `Me { id, name, email, role }` · 401 |\n| POST | `/auth/demo` | `{ as: 'shopper' \\| 'owner' }` → `Me` |\n\n### Catalogue (public)\n| Method | Path | Returns |\n|---|---|---|\n| GET | `/products?category=&size=&colour=&min=&max=&sort=new\\|price_asc\\|price_desc&page=` | `Page<ProductCard>` — live products only; size filter = any variant with available > 0 · `s-maxage=300` |\n| GET | `/products/{slug}` | `Product` (colourways, variants with `available`, photos with thumbhash) · 404 if draft |\n| GET | `/products/{slug}/similar?k=8` | `ProductCard[]` with `score` — pgvector on the hero embedding · `s-maxage=300` |\n| GET | `/search?q=&page=` | `Page<ProductCard>` — v1 full-text; v2 hybrid (adds `matched_by: 'text' \\| 'semantic'`) |\n| GET | `/home` | `{ new_in: ProductCard[], categories: {key, count, cover}[], for_you?: ProductCard[] (v3) }` |\n| GET | `/filters?category=` | `{ sizes: {size, count}[], colours: {bucket, hex, count}[], price: {min, max} }` |\n\n### Cart (cookie `oc_cart` or session)\n| Method | Path | Body → Returns |\n|---|---|---|\n| GET | `/cart` | `Cart { lines: [{ variant_id, product, size, colour, photo, unit_paise, qty, available }], subtotal_paise, delivery_paise, total_paise }` |\n| POST | `/cart/lines` | `{ variant_id, qty }` → `Cart` · 409 `out_of_stock` |\n| PATCH | `/cart/lines/{variant_id}` | `{ qty }` (0 = remove) → `Cart` |\n| DELETE | `/cart` | → 204 |\n\n### Checkout & orders\n| Method | Path | Body → Returns |\n|---|---|---|\n| POST | `/checkout` | `{ email, phone, address \\| address_id, discount_code? (v3) }` → `{ order_id, number, key, razorpay_order_id, key_id, amount_paise }` · 409 `out_of_stock { variant_id }` · 422 `cart_empty` |\n| POST | `/checkout/{order_id}/verify` | `{ razorpay_payment_id, razorpay_signature }` → `Order` · 400 `bad_signature` |\n| POST | `/checkout/{order_id}/cancel` | → `Order` (only from `pending_payment`; releases stock) |\n| GET 🔑 | `/orders/{number}?key=` | `Order { number, state, lines, address, totals, events[], courier, tracking_id, paid_at }` |\n| POST | `/orders/track` | `{ number, email }` → `Order` (rate-limited) |\n| POST 🔑 | `/orders/{number}/claim` | `{ password }` → `Me` — success-page \"create an account\": creates the user with the order's email, attaches order + address |\n| GET 🔒 | `/account/orders` | `OrderCard[]` |\n| GET/POST 🔒 | `/account/addresses` · PATCH/DELETE `/account/addresses/{id}` | address book |\n\n### Owner 👑\n| Method | Path | Body → Returns |\n|---|---|---|\n| GET | `/owner/products?status=&q=` | `OwnerProductRow[]` (photo, name, category, variants, stock_total, status) |\n| POST | `/owner/products` | `{ name, slug?, category, price_paise, description, tags, colourways: [{name, hex}], sizes: [] }` → `OwnerProduct` (variants generated as the matrix) |\n| GET/PATCH | `/owner/products/{id}` | `OwnerProduct` (variants with stock / reserved, photos with pipeline fields) |\n| POST | `/owner/products/{id}/status` | `{ status }` → `OwnerProduct` · 409 `no_live_variants` |\n| POST | `/owner/products/{id}/photos` | multipart `file`, `colourway_id?` → `ProductPhoto { url, width, height, thumbhash, colour, embedded: bool }` · 413 · 415 · 502 `storage_failed` |\n| PATCH | `/owner/products/{id}/photos/order` | `{ ids: [] }` → 204 |\n| POST | `/owner/products/{id}/photos/{photo_id}/embed` | → `ProductPhoto` (retry) |\n| DELETE | `/owner/products/{id}/photos/{photo_id}` | → 204 (Blob delete) |\n| GET | `/owner/inventory?low=` | `VariantRow[]` (product, sku, size, colour, stock, reserved, available) |\n| POST | `/owner/inventory/{variant_id}/adjust` | `{ delta, reason }` → `VariantRow` · 409 `below_reserved` |\n| GET | `/owner/orders?state=` | `OrderCard[]` (runs `expire_stale()` first) |\n| GET | `/owner/orders/{number}` | `Order` + `allowed_transitions: order_state[]` |\n| POST | `/owner/orders/{number}/transition` | `{ to, note?, courier?, tracking_id? }` → `Order` · 409 `invalid_transition` |\n\n### Server-to-server ⚙\n| Method | Path | Notes |\n|---|---|---|\n| POST | `/webhooks/razorpay` | `X-Razorpay-Signature` HMAC over the raw body; `webhook_events.id` unique; `payment.captured → mark_paid`, `payment.failed → cancel if pending` |\n| POST (web) | `{WEB_URL}/api/revalidate` | `{ tags: [], secret }` — called on product / photo / stock / status writes |\n\n### v2\n| Method | Path | Notes |\n|---|---|---|\n| POST | `/lens/search` | multipart `file` (≤ 4 MB after downscale), `crop: {x,y,w,h}?`, `category?` → `{ matches: [{ product: ProductCard, score, photo_url }], took_ms }` · 415 · 503 `search_unavailable` |\n| GET | `/search?q=` | hybrid (RRF over FTS + text embedding) |\n| POST 🔑 | `/orders/{number}/returns` | `{ order_line_id, reason }` → `Order` (≤ 7 days after delivered) · 409 |\n| POST 👑 | `/owner/returns/{id}/decide` | `{ approve: bool, note? }` → refund → `Order` |\n| GET 👑 | `/owner/dashboard?days=7\\|30` | `{ revenue_paise, orders, aov_paise, top_products[], low_stock }` |\n| POST | `/auth/forgot` · `/auth/reset` | Resend link |\n\n### v4 (web only)\n`/manifest.webmanifest` (share_target) · `/sw.js` · `POST /lens/share` (handled by the service worker, never reaches the API) · `/lens?shared=1`.\n\n### v3 (sketch; detailed when v3 starts)\n`POST /lens/search` accepts `crops: []` → `{ boards: [{ crop, matches[] }] }` · `GET /home` adds `for_you` from `X-Viewed` (cookie of last 20 product ids) · `POST /owner/products/{id}/photos` returns `duplicate_of?: { photo, score }` when ≥ 0.95 · `GET/POST/DELETE /owner/discounts` · `POST /checkout` validates `discount_code` · daily low-stock digest (`scripts/low_stock_digest.py`, run by hand or a Vercel cron once the project moves off Hobby).\n\n## D. Payload shapes that matter\n```ts\ntype ProductCard = { id: string; slug: string; name: string; category: Category; price_paise: number;\n                     photo: Photo; colourways: { name: string; hex: string }[]; sold_out: boolean; score?: number };\ntype Photo = { url: string; width: number; height: number; thumbhash: string; colour: string };\ntype Product = ProductCard & { description: string; tags: string[];\n                     colourways: { id: string; name: string; hex: string; photos: Photo[] }[];\n                     variants: { id: string; colourway_id: string; size: string; available: number }[] };\ntype Cart = { lines: CartLine[]; subtotal_paise: number; delivery_paise: number; total_paise: number };\ntype Order = { number: string; state: OrderState; lines: OrderLine[]; address: Address; email: string;\n               subtotal_paise: number; delivery_paise: number; discount_paise: number; total_paise: number;\n               events: { from: OrderState | null; to: OrderState; at: string; note?: string }[];\n               courier?: string; tracking_id?: string; paid_at?: string; allowed_transitions?: OrderState[] };\ntype OrderState = 'pending_payment'|'paid'|'packed'|'shipped'|'delivered'|'expired'|'cancelled'|'return_requested'|'returned'|'return_rejected';\ntype CheckoutStart = { order_id: string; number: string; key: string; razorpay_order_id: string; key_id: string; amount_paise: number };\ntype LensResult =
